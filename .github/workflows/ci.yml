name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          python -m spacy download en_core_web_sm
        timeout-minutes: 15

      - name: Lint
        run: |
          pip install ruff
          ruff format --check .
          ruff check .

      - name: Test
        run: python -m pytest tests/ -v --tb=short

      - name: Smoke test (synthetic data generation)
        run: |
          python -c "from src.ingestion.synthetic_generator import generate_synthetic_data; posts = generate_synthetic_data(100); print(f'Generated {len(posts)} posts')"
